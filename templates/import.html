<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" href="{{ url_for('static', filename='dm.png')}}">
    <title> Plant Disease Classification Using Deep Learning</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <link href="{{ url_for('static', filename='css/test.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/newjs.js') }}" type="text/javascript"></script>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            background-image: url('./static/bg.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        .black {
            width: 100vw;
            height: 100vh;
            /* background-image: linear-gradient(to top, rgba(0, 0, 0, 0.25), transparent); */
        }

        header {
            width: 100vw;
            height: 12vh;
            display: grid;
            place-content: center;
        }

        nav {
            width: 90vw;
            height: 12vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .right-sec {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 15vw;
        }

        .right-sec a {
            text-decoration: none;
            font-size: 5.25vmin;
            font-weight: 800;
            color: whitesmoke;
        }

        .left-sec {
            width: 25%;
            display: flex;
            gap: 3.5vw;
        }

        .left-sec a {
            text-decoration: none;
            font-size: 1.12vmax;
            font-weight: 500;
            color: rgba(255, 255, 208, 0.85);
            /* background-color: rgba(245, 245, 245, 0.15); */
            padding: 0.5vmax 1vmax;
            /* border-radius: 0.25vw; */
            opacity: 0.75;
            /* backdrop-filter: blur(8px);*/
            transition: color 300ms ease-in-out,
                background-color 300ms ease-in-out,
                font-size 300ms 0ms ease-in-out,
                box-shadow 300ms ease-in-out,
                text-shadow 300ms 0ms ease-in-out,
                border-radius 300ms 0ms ease-in-out;
        }

        .left-sec a:hover,
        a[href='index_copy.html'] {
            color: white;
            background-color: rgba(201, 75, 47, 0.9);
            font-size: 1.125vw;
            box-shadow: -8px 8px 14px rgba(0, 0, 0, 0.75);
            text-shadow: -2px 6px 12px rgba(0, 0, 0, 0.85);
            border-radius: 1.5rem;
        }

        main {
            margin: auto;
            width: 90vw;
            height: calc(100vh - 10vh);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-right {
            width: 35vw;
            height: 100%;
            padding: 8% 0 0 0;
        }

        .form-right h1 {
            font-size: 5.5vw;
            color: #fff;
        }

        h1 span {
            color: transparent;
            -webkit-text-stroke: 2.25px rgba(201, 75, 47, 0.9);
            text-shadow: -12px 16px 24px rgba(0, 0, 0, 0.55);
        }

        .form-right form #imageUpload {
            width: 60%;
            margin-top: 2.5rem;
            font-weight: bold;
            color: rgb(201, 117, 18);
            padding: 1em;
            border: 2px solid rgba(201, 116, 18, 0.75);
            border-radius: 2.25rem;
            transition: border 250ms 0ms ease-in-out,
                box-shadow 250ms 0ms ease-in-out,
                background-color 250ms 0ms ease-in-out,
                color 250ms 0ms ease-in-out,
                transform 250ms 0ms ease-in-out;
        }

        form #imageUpload:hover {
            border: 2px solid rgba(245, 245, 245, 0.35);
            background-color: rgb(201, 117, 18);
            box-shadow: -10px 10px 16px rgba(0, 0, 0, 0.75),
                inset -10px 10px 12px rgba(0, 0, 0, 0.5);
            color: #000;
            transform: scale(0.95);
        }

        #imageUpload::file-selector-button {
            border: none;
            background-color: transparent;
            outline: none;
            color: white;
            font-size: 1.25vw;
        }

        .image-section {
            width: 47vw;
            height: 80%;
            background-color: rgba(0, 55, 0, 0.25);
            backdrop-filter: blur(0.65rem);
            border-radius: 1.5rem;
            padding: 0.5vw 1.5vw;
            box-shadow: -10px 10px 24px rgba(0, 0, 0, 0.65),
                inset -10px -10px 32px rgba(245, 245, 245, 0.15);
            border: 2px inset rgba(255, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.45);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .image-section .image {
            margin-top: 2vw;
            width: 90%;
            height: 62.5%;
            border-radius: 1rem;
            overflow: hidden;
            /* box-shadow: 0px 0px 32px rgba(245, 245, 245, 0.35); */
        }

        #container2 {  
            margin: auto;
            width: 95vw;
            height: 89vh;
            display: flex;
            flex-direction: column;
            gap: 2vw;
            padding: 2vw;
            color: rgba(255, 255, 255, 1);
            border: 5px solid rgb(201, 117, 18);
            border-radius: 2rem;
        }

        .box {
            height: 70%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 55, 0, 0.25);
            backdrop-filter: blur(0.65rem);
            border-radius: 1.5rem;
            padding: 0.5vw 1.5vw;
            box-shadow: -10px 10px 24px rgba(0, 0, 0, 0.65),
                inset -10px -10px 32px rgba(245, 245, 245, 0.15);
            border: 2px inset rgba(255, 255, 255, 0.25);
        }

        #result {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            font-size: 4vw;
            font-weight: bolder;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        #sol {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            font-size: 1.5vw;
        }

        /* #links {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            font-size: 1.5vw;
        } */
    </style>
</head>

<body>
    <div class="black">
        <header>
            <nav>
                <div class="right-sec">
                    <img src="./static/dm.png" alt="brand"
                        style="width: 25%; height: 100%; object-fit: cover; margin-top: 5px;">
                    <a href="index-copy.html"> Plant <span style="color: rgb(201, 117, 18);">Di.</span></a>
                </div>
                <div class="left-sec">
                    <a href="index_copy.html">Home</a>
                    <a href="#contact">Contact</a>
                    <a href="#more">More</a>
                </div>
            </nav>
        </header>

        {% block content %}
        {% endblock %}

</body>


</html>
